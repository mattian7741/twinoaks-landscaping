<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting…</title>

    <!-- Immediate redirect -->
    <meta http-equiv="refresh" content="0; url=https://www.facebook.com/search/top/?q=twin%20oaks%20landscaping%20bucks%20county" />

    <!-- Canonical for crawlers -->
    <link rel="canonical" href="https://www.facebook.com/search/top/?q=twin%20oaks%20landscaping%20bucks%20county" />

    <script>
      // JS redirect fallback (keeps URL intact)
      window.location.replace("https://www.facebook.com/search/top/?q=twin%20oaks%20landscaping%20bucks%20county");
    </script>
  </head>
  <body>
    <p>
      Redirecting to Facebook…
      <a href="https://www.facebook.com/search/top/?q=twin%20oaks%20landscaping%20bucks%20county">Click here if you’re not redirected.</a>
    </p>
  </body>
</html>
